{% extends 'layout/base.html' %}

{% block title %}
  Register
{% endblock %}

{% block content %}
  <center>
    <h2>Register Page</h2>
  </center><br />

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">User Name</label>
      <input type="text" name="u_name" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" />
    </div>

    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Email Address</label>
      <input type="email" name="u_email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" />
    </div>

    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">First Name</label>
      <input type="text" name="u_f_name" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" />
    </div>

    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Last Name</label>
      <input type="text" name="u_l_name" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" />
    </div>

    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">User Type</label>
      <select class="form-select" name="u_type" aria-label="Default select example">
        <option value="Admin">Admin</option>
        <option value="Salesman">Salesman</option>
        <option value="Customer">Customer</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Photo</label>
      <input type="file" name="u_image" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" />
    </div>

    <div class="mb-3">
      <label for="exampleInputPassword1" class="form-label">Password</label>
      <input type="password" name="u_password" class="form-control" id="exampleInputPassword1" />
    </div>

    <div class="mb-3">
      <label for="exampleInputPassword1" class="form-label">Confirm Password</label>
      <input type="password" name="u_conf_password" class="form-control" id="exampleInputPassword1" />
    </div>

    <button type="submit" class="btn btn-primary">Register</button>
  </form>

  <br /><center>
    <a href="{% url 'login_page' %}" class="btn">Already have an account!</a><br><br>
  </center>
{% endblock %}
