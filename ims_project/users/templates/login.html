{% extends 'layout/base.html' %}

{% block title %}
  Login
{% endblock %}

{% block content %}
  <center>
    <h2>Login Page</h2>
  </center><br />

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">User Name</label>
      <input type="text" name="u_name" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" />
    </div>

    <div class="mb-3">
      <label for="exampleInputPassword1" class="form-label">Password</label>
      <input type="password" name="u_password" class="form-control" id="exampleInputPassword1" />
    </div>

    <button type="submit" class="btn btn-primary">Login</button>
  </form>

  <br /><center>
    <a href="{% url 'register_page' %}" class="btn">Don't have an account!</a>
  </center>
{% endblock %}
