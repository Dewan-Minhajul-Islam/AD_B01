{% extends 'layout/base.html' %}

{% block title %}
  Add Product
{% endblock %}

{% block content %}
  <center>
    <h2>New Product Arrival</h2>
  </center><br />

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Product Name</label>
      <input type="text" name="p_name" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" />
    </div>

    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Description</label>
      <textarea name="p_description" class="form-control" id=""></textarea>
    </div>

    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Production Date</label>
      <input type="date" name="p_date" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" />
    </div>

    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Product Type</label>

      <select class="form-select" name="p_type" id="floatingSelect" aria-label="Floating label select example">
        <option selected>Select Product Type</option>
        <option value="Fruits">Fruits</option>
        <option value="Fashion">Fashion</option>
        <option value="Grocery">Grocery</option>
        <option value="Gadget">Gadget</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="exampleInputEmail1" class="form-label">Product Image</label>
      <input type="file" name="p_image" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" />
    </div>

    <button type="submit" class="btn btn-primary">Add Product</button>
  </form>
{% endblock %}
